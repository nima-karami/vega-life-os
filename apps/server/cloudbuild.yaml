# Build the server image from the repo root, where its Dockerfile expects the workspace.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/server/Dockerfile
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
