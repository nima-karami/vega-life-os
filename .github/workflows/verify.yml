name: verify

# Fast checks on every push and PR, in one job so setup and per-job minute rounding are paid
# once. e2e runs at release time instead (e2e.yml, called by release.yml) — user decision
# 2026-10-23, docs/release-process.md §3.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      # tsc -b over three projects can exceed the default heap on the 7 GB runner.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scope detection diffs the base; gitleaks scans history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # docs-only or web-only → skip the server suite (user decision 2026-10-22). A push only
      # narrows when its base was itself verified green; any detection doubt resolves to "full".
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          base="$BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$base" ]; then
            base_verify="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$base&event=push&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "missing"' || echo "unreadable")"
            if [ "$base_verify" != "success" ]; then
              echo "verify for base $base is '$base_verify' — running everything"
              base=""
            fi
          fi
          node scripts/ci-scope.mjs "$base" >> "$GITHUB_OUTPUT" || echo "scope=full" >> "$GITHUB_OUTPUT"
      # Before npm ci, so Semgrep sees exactly the checked-out tree.
      - name: SAST (Semgrep)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:1.181.0 \
            semgrep scan --error --metrics off --config p/javascript --config p/typescript --config p/react --config p/nodejs
      - run: npm ci
      - run: node scripts/check-lockfile-platforms.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deadcode
      - run: npm run dupes
      - run: node scripts/check-suppressions.mjs
      - run: npm run test:scripts
      - run: npm test --workspace @vega/web
      - run: npm test --workspace @vega/shared
      # The server suite boots the Firestore/Auth emulator, which needs a JRE 11+.
      - if: steps.scope.outputs.scope == 'full'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: steps.scope.outputs.scope == 'full'
        run: npm test --workspace @vega/server
      - if: steps.scope.outputs.scope == 'full'
        run: npm run smoke:server-bundle
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high
      - name: Dependency audit (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
