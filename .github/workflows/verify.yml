name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # tsc -b over three projects can exceed the default heap on the 7 GB runner.
      NODE_OPTIONS: --max-old-space-size=6144
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-lockfile-platforms.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deadcode
      - run: npm run dupes
      - run: node scripts/check-suppressions.mjs
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high
      - name: Dependency audit (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=package-lock.json
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workspace: ["@vega/web", "@vega/server", "@vega/shared"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The server suite boots the Firestore/Auth emulator, which needs a JRE 11+.
      - if: matrix.workspace == '@vega/server'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test --workspace ${{ matrix.workspace }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shardIndex: 1, shardTotal: 3 }
          - { project: chromium, shardIndex: 2, shardTotal: 3 }
          - { project: chromium, shardIndex: 3, shardTotal: 3 }
          - { project: mobile-chromium, shardIndex: 1, shardTotal: 2 }
          - { project: mobile-chromium, shardIndex: 2, shardTotal: 2 }
          - { project: pwa, shardIndex: 1, shardTotal: 1, pwa: "1" }
    env:
      E2E_PWA: ${{ matrix.pwa }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shardIndex }}of${{ matrix.shardTotal }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep
        run: semgrep scan --error --metrics off --config p/javascript --config p/typescript --config p/react --config p/nodejs
